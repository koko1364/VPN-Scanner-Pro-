name: Refresh subscriptions
on:
  workflow_dispatch:
  push:
    paths:
      - scanner.py
      - .github/workflows/scan.yml
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: vpn-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install Xray
        run: |
          curl -fLsS --retry 3 https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray.zip
          unzip -o /tmp/xray.zip xray -d /tmp/xray-bin
          sudo install -m 755 /tmp/xray-bin/xray /usr/local/bin/xray
          xray version
      - run: python3 scanner.py
      - name: Generate TIZY alternate formats
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          from urllib.parse import urlsplit, parse_qs
          raw = Path('tizy.txt').read_bytes()
          Path('tizy-base64.txt').write_bytes(base64.b64encode(raw))
          clean = []
          for line in raw.decode().splitlines():
              try:
                  u = urlsplit(line)
                  q = parse_qs(u.query)
                  if u.scheme == 'vless' and q.get('security') == ['reality'] and q.get('type', ['tcp'])[0] in ('tcp', 'raw'):
                      clean.append(line.split('#', 1)[0] + '#TIZY-' + str(len(clean)+1))
              except ValueError:
                  continue
          Path('tizy-clean.txt').write_text('\n'.join(clean) + ('\n' if clean else ''), encoding='ascii')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2box.txt tizy.txt tizy-base64.txt tizy-clean.txt stability.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh subscription candidates"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet HEAD^ origin/main -- scanner.py .github/workflows/scan.yml; then
              echo "Scanner changed during execution; newer workflow will publish."
              exit 0
            fi
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
