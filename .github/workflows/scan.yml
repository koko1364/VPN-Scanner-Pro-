name: Refresh subscriptions
on:
  workflow_dispatch:
  push:
    paths:
      - scanner.py
      - .github/workflows/scan.yml
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: vpn-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Xray
        run: |
          curl -fLsS --retry 3 https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray.zip
          unzip -o /tmp/xray.zip xray -d /tmp/xray-bin
          sudo install -m 755 /tmp/xray-bin/xray /usr/local/bin/xray
          xray version
      - run: python3 scanner.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2box.txt tizy.txt stability.json
          git diff --cached --quiet || (git commit -m "Refresh subscription candidates" && git push)
